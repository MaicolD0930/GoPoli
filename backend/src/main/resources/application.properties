spring.application.name=GoPoli
server.port=${PORT:8080}

# Carga backend/.env (Neon, GOOGLE_MAPS_API_KEY, etc.)
spring.config.import=optional:file:.env[.properties]

# Produccion / equipo: Neon o Railway — define SPRING_DATASOURCE_* (ver DATABASE_NEON.md).
# Neon: la URL JDBC debe incluir ?sslmode=require
# Local sin variables ni backend/.env: postgres en localhost:5432/gopoli
# Equipo (recomendado): copia .env.example -> .env con credenciales Neon
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/gopoli}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:postgres}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:123456789}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# JWT (cambiar secret en produccion)
gopoli.jwt.secret=${GOPOLI_JWT_SECRET:GoPoliDevSecretKeyMinimo32Caracteres!!}
gopoli.jwt.expiration-hours=168

# Misma clave que frontend (Directions API). Copia desde google_maps_config.dart o .env
gopoli.google.maps.api-key=${GOOGLE_MAPS_API_KEY:}